<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Warroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #101210; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="day"] { background-color: #d8d2bf; color-scheme: light; }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
    <!-- Day is the default edition (user decision, D-052); a stored night
         choice applies before first paint so there's no theme flash -->
    <script>
      try {
        var t = localStorage.getItem('warroom-theme')
        if (t === 'night') document.documentElement.dataset.theme = 'slate'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
